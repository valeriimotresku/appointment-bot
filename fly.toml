app = "termin-app"

primary_region = "ams" # or nearest region
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "./Dockerfile.fly.io"

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
