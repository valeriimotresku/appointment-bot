<!DOCTYPE html>
<html>
<head>
    <title>Appointment Bot</title>
    <link rel='stylesheet' href='/static/css/style.css'>
</head>
<body>
<h2>Appointment Watcher</h2>
<form id="watchForm">
    <label>Full Name:</label>
    <input type="text" id="full_name" required>

    <label>Phone Number:</label>
    <input type="tel" id="phone" pattern="\d{12}" maxlength="12">

    <label>Birth Date:</label>
    <input type="text" id="birth_date" required>

    <label>From Date:</label>
    <input type="date" id="date_from" required>

    <label>To Date:</label>
    <input type="date" id="date_to" required>

    <label>Email:</label>
    <input type="email" id="email" required>

    <button type="submit">Start Watching</button>
</form>

<script>
document.getElementById('watchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
        full_name: document.getElementById('full_name').value,
        phone: document.getElementById('phone').value,
        birth_date: document.getElementById('birth_date').value,
        date_from: document.getElementById('date_from').value,
        date_to: document.getElementById('date_to').value,
        email: document.getElementById('email').value
    };
    const res = await fetch('/watch/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });
    alert('Watcher started!');
});
</script>
<h2>Active Watch Requests</h2>
<table id="watchTable" border="1" cellpadding="5">
    <thead>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Phone</th>
            <th>Birth Date</th>
            <th>Date From</th>
            <th>Date To</th>
            <th>Email</th>
            <th>Active</th>
            <th>Booked Time</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
async function loadWatchRequests() {
    const res = await fetch('/status/');
    const data = await res.json();
    const tbody = document.querySelector('#watchTable tbody');
    tbody.innerHTML = ''; // clear table

    data.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${r.id}</td>
            <td>${r.full_name}</td>
            <td>${r.phone}</td>
            <td>${r.birth_date}</td>
            <td>${r.date_from}</td>
            <td>${r.date_to}</td>
            <td>${r.email}</td>
            <td>${r.active}</td>
            <td>${r.booked_datetime}</td>
            <td><button onclick="deleteRequest(${r.id})">Delete</button></td>
        `;
        tbody.appendChild(tr);
    });
}

async function deleteRequest(id) {
    if (!confirm('Delete this request?')) return;
    const res = await fetch(`/status/${id}`, { method: 'DELETE' });
    if (res.ok) {
        await loadWatchRequests(); // refresh table
    } else {
        alert('Error deleting request');
    }
}

// Auto-refresh table every 10 seconds
setInterval(loadWatchRequests, 10000);
loadWatchRequests(); // initial load
</script>
</body>
</html>
